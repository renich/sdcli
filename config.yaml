image_path: ~/Pictures/artwork/text
model_path: /usr/local/share/models/comfyui/checkpoints/mklanANIMEHentai_nextgenV3.safetensors
vae_path: madebyollin/sdxl-vae-fp16-fix
scheduler_path: stabilityai/stable-diffusion-xl-base-1.0
wildcards_dir: /usr/local/share/models/comfyui/wildcards
prompts_dir: prompts
environment:
  HF_HOME: '/usr/local/share/models/huggingface'
  HSA_OVERRIDE_GFX_VERSION: '11.0.0'
  HSA_USE_UNIFIED_MEMORY: '1'
  MIOPEN_FIND_MODE: '2'
  PYTORCH_ROCM_ARCH: 'gfx1100'
  PYTORCH_TUNABLEOP_ENABLED: '1'
  TORCH_BLAS_PREFER_HIPBLASLT: '0'
  TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
generation:
  width: 1024
  height: 1024
  steps: 50
  guidance_scale: 4
  count: 1
  batch_size: 1
  scheduler: "EulerAncestral"
  enable_pag: false
  pag_scale: 0.0
  enable_freeu: true
  enable_compilation: false
  enable_cpu_offload: false
upscaling:
  enabled: true
  model_path: /usr/local/share/models/comfyui/upscale_models/4x_NMKD-Superscale-SP_178000_G.pth
  scale_factor: 4
refiner:
  enabled: true
  model_path: "same_as_base"
  use_sam: true
  sam_model: "sam2.1_hiera_large.pt"
  sam_dir: "/usr/local/share/models/comfyui/sams"
  yolo_face_model: "/usr/local/share/models/comfyui/ultralytics/bbox/yolov12l-face.pt"
  yolo_human_model: "/usr/local/share/models/comfyui/ultralytics/segm/person_yolov8m-seg.pt"
  targets: ["world", "body", "face"]
  sam_confidence_threshold: 0.8
  debug_yolo: false
  strength: 0.3
  steps: 25
  guidance_scale: 4.0
  face_crop_size: 768
  face_strength: 0.35
  face_steps: 25
  face_guidance_scale: 4.5
  face_prompt: "score_9, (masterpiece:1.2), beautiful detailed face, glowing eyes, detailed iris, long hair, flawless smooth skin, high detail, sharp focus"
  face_negative_prompt: "deformed eyes, crooked face, bad anatomy, ugly, artifacts, distortion, blurry"
  body_strength: 0.25
  body_steps: 20
  body_guidance_scale: 4.0
  body_prompt: "score_9, (masterpiece:1.2), beautifully detailed character, intricate clothes, smooth detailed skin, perfect anatomy, high quality"
  body_negative_prompt: "ugly, bad anatomy, deformed, extra limbs, extra fingers, blurry, artifacts"
  world_strength: 0.25
  world_steps: 20
  world_guidance_scale: 4.0
  world_prompt: "score_9, (masterpiece:1.2), beautiful atmospheric background, highly detailed scenery, volumetric lighting, sharp focus, 8k"
  world_negative_prompt: "blurry, low quality, artifacts, distortion, characters, faces"
  prompt: ""
  negative_prompt: ""

video_path: ~/Videos/artwork
video_model_path: /usr/local/share/models/wan2.2-diffusers
