image_path: ~/Pictures/artwork/text
model_path: /usr/local/share/models/comfyui/checkpoints/mklanANIMEHentai_nextgenV3.safetensors
vae_path: madebyollin/sdxl-vae-fp16-fix
scheduler_path: stabilityai/stable-diffusion-xl-base-1.0
wildcards_dir: /usr/local/share/models/comfyui/wildcards
prompts_dir: prompts
environment:
  HSA_OVERRIDE_GFX_VERSION: '11.0.0'
  HSA_USE_UNIFIED_MEMORY: '1'
  MIOPEN_FIND_MODE: '2'
  PYTORCH_ROCM_ARCH: 'gfx1100'
  PYTORCH_TUNABLEOP_ENABLED: '1'
  TORCH_BLAS_PREFER_HIPBLASLT: '0'
  TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
generation:
  width: 1024
  height: 1024
  steps: 50
  guidance_scale: 4
  count: 1
  batch_size: 1
  scheduler: "EulerAncestral"
  enable_pag: true
  pag_scale: 3.0
  enable_freeu: true
upscaling:
  enabled: true
  model_path: /usr/local/share/models/comfyui/upscale_models/4x-UltraSharp.pth
  scale_factor: 4
  tile_size: 512
  tile_overlap: 32
refiner:
  enabled: true
  strength: 0.5
  steps: 30
  guidance_scale: 2
  # Optional overrides for refinement (leave empty to use original prompts)
  prompt: "gigantic lips, highly detailed"
  negative_prompt: "male, ugly, distorted"
