image_path: ~/Pictures/artwork/text
model_path: /usr/local/share/models/comfyui/checkpoints/mklanANIMEHentai_nextgenV3.safetensors
vae_path: madebyollin/sdxl-vae-fp16-fix
scheduler_path: stabilityai/stable-diffusion-xl-base-1.0
wildcards_dir: /usr/local/share/models/comfyui/wildcards
prompts_dir: prompts
environment:
  HSA_OVERRIDE_GFX_VERSION: '11.0.0'
  HSA_USE_UNIFIED_MEMORY: '1'
  MIOPEN_FIND_MODE: '2'
  PYTORCH_ROCM_ARCH: 'gfx1100'
  PYTORCH_TUNABLEOP_ENABLED: '1'
  TORCH_BLAS_PREFER_HIPBLASLT: '0'
  TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
generation:
    width: 1024
    height: 1024
    steps: 50
    guidance_scale: 4
    count: 1
    batch_size: 1
    scheduler: "EulerAncestral"
    enable_pag: false
    pag_scale: 0.0
    enable_freeu: true
    enable_compilation: false
upscaling:
  enabled: true
  model_path: /usr/local/share/models/comfyui/upscale_models/4x_NMKD-Superscale-SP_178000_G.pth
  scale_factor: 4
  tile_size: 512
  tile_overlap: 32
refiner:
   enabled: true
   model_path: "stabilityai/stable-diffusion-xl-refiner-1.0"
   use_sam: true
   sam_model: "sam2.1_hiera_large.pt"
   sam_confidence_threshold: 0.7
   strength: 0.4
   steps: 30
    guidance_scale: 2
    debug_yolo: false
    # Optional overrides for refinement (leave empty to use original prompts)
   prompt: "gigantic lips, baby traits, blowing eyes, highly detailed, correct anatomy"
   negative_prompt: "artifacts, distortion, anatomical errors"
